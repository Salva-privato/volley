<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Regia · Martesana Volley</title>
<link rel="apple-touch-icon" href="icona-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d4f50">
<!--
  Chi batte i punti. Si apre in due modi:
   - con la parola d'ordine (chi cura l'app)
   - con un invito a tempo:  regia.html?t=GETTONE   (un altro genitore)
  Il punteggio parte sempre intero, mai a pezzi: due tocchi vicini non
  possono scambiarsi di posto e lasciare un risultato impossibile.
-->
<style>
  :root{
    --bg:#0b1a19; --surface:#12302f; --surface-2:#1a3d3b; --text:#e7efed;
    --muted:#8fa5a2; --line:#23403d; --accent:#1d4f50; --gold:#c9922f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text); font-size:16px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-variant-numeric:tabular-nums;
    padding:env(safe-area-inset-top) 12px calc(12px + env(safe-area-inset-bottom));
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  h1{font-size:15px;font-weight:700;letter-spacing:.02em;margin:14px 0 10px;color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  select,input{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface-2);
    border:1px solid var(--line);border-radius:10px;padding:11px 12px;-webkit-appearance:none}
  button{font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line);
    border-radius:12px;padding:12px;font-weight:700;cursor:pointer}
  button:active{transform:translateY(1px)}
  button[disabled]{opacity:.4}
  .campo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .sq{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
  .sq.noi{border-color:var(--accent);background:#173f3f}
  .sq .nome{font-size:12px;font-weight:700;color:var(--muted);height:2.6em;overflow:hidden;
    display:flex;align-items:center;justify-content:center;line-height:1.3}
  .sq .punti{font-size:62px;font-weight:800;line-height:1.05;margin:2px 0 8px}
  .sq.noi .punti{color:#ffd77a}
  .sq .set{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:10px}
  .sq .dove{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;opacity:.75}
  .piu{width:100%;font-size:38px;padding:26px 16px;background:var(--accent);border-color:transparent;line-height:1}
  .meno{width:100%;margin-top:8px;font-size:18px;padding:8px;color:var(--muted)}
  .azioni{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .azioni button{padding:14px}
  .fine{grid-column:1/-1;background:var(--gold);color:#221602;border-color:transparent}
  .via{grid-column:1/-1;background:none;color:var(--muted);font-weight:600;font-size:13px;padding:10px}
  .stato{font-size:12px;color:var(--muted);text-align:center;margin:10px 0;min-height:1.3em}
  .stato.male{color:#f08072}
  .parziali{font-size:13px;color:var(--muted);text-align:center;margin-top:10px;letter-spacing:.06em}
  .invito{font-size:12px;color:var(--muted);line-height:1.5}
  .invito button{width:100%;margin-top:8px;font-size:14px;padding:10px}
  .nascosto{display:none}
  /* Aggiunta all'app sulla schermata di casa, la regia si apre nella stessa
     finestra e senza i tasti del browser: senza questo collegamento, per
     tornare all'app bisognerebbe chiudere tutto e riaprire. Resta appiccicato
     in alto perche' mentre si battono i punti si scorre, e la strada di
     ritorno deve essere sempre sotto il pollice. */
  .torna{position:sticky;top:calc(env(safe-area-inset-top) + 6px);z-index:5;
    display:inline-flex;align-items:center;gap:6px;margin-top:10px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
    padding:8px 14px;font-size:13px;font-weight:700;color:var(--text);
    text-decoration:none;box-shadow:0 2px 10px #0006}
  .torna:active{transform:translateY(1px)}
</style>
</head>
<body>

<a class="torna" href="./">‹ Torna all'app</a>

<div id="entra" class="card">
  <h1 style="margin-top:0">Regia</h1>
  <input id="parola" type="password" placeholder="parola d'ordine" autocomplete="current-password">
  <button style="width:100%;margin-top:10px;background:var(--accent);border-color:transparent" id="entraOk">Entra</button>
  <p class="invito" id="entraNota"></p>
</div>

<div id="tutto" class="nascosto">
  <h1>Che partita</h1>
  <div class="card">
    <select id="partita"></select>
  </div>

  <div class="campo">
    <div class="sq" id="sq1">
      <div class="dove">in casa</div>
      <div class="nome" id="n1"></div>
      <div class="punti" id="p1">0</div>
      <div class="set" id="s1">set 0</div>
      <button class="piu" data-chi="0" data-quanto="1">+</button>
      <button class="meno" data-chi="0" data-quanto="-1">−</button>
    </div>
    <div class="sq" id="sq2">
      <div class="dove">in trasferta</div>
      <div class="nome" id="n2"></div>
      <div class="punti" id="p2">0</div>
      <div class="set" id="s2">set 0</div>
      <button class="piu" data-chi="1" data-quanto="1">+</button>
      <button class="meno" data-chi="1" data-quanto="-1">−</button>
    </div>
  </div>

  <div class="parziali" id="parziali"></div>
  <div class="stato" id="stato"></div>

  <div class="azioni">
    <button id="annulla">Annulla ultimo</button>
    <button id="chiudiSet">Set finito</button>
    <button class="fine" id="chiudiPartita">Partita finita</button>
    <button class="via" id="togli">Togli il punteggio dall'app</button>
  </div>

  <div class="card" id="delega" style="margin-top:16px">
    <div class="invito">
      Se oggi non ci sei tu, manda un invito: vale solo per oggi e non contiene
      la parola d'ordine.
      <button id="invitoPunti">Invito per segnare i punti</button>
      <button id="invitoVideo">Invito per trasmettere</button>
    </div>
  </div>
</div>

<script>
const SERVIZIO = 'https://volley-notifiche.n8ns-piazzolla.workers.dev';
const CHIAVE_PAROLA = 'regiaParola';
const CHIAVE_GETTONE = 'regiaGettone';

/* Chi e' stato invitato ha il gettone nell'indirizzo. Ma se va a vedere l'app
   e poi torna qui dal collegamento in fondo alla pagina, l'indirizzo e' quello
   pulito e il gettone sarebbe perso: percio' si tiene da parte per la giornata,
   quanto dura l'invito. */
function ricordaGettone(){
  const nuovo = new URLSearchParams(location.search).get('t') || '';
  if (nuovo){
    try { localStorage.setItem(CHIAVE_GETTONE, JSON.stringify({ t: nuovo, quando: Date.now() })); } catch (e) {}
    return nuovo;
  }
  try {
    const v = JSON.parse(localStorage.getItem(CHIAVE_GETTONE) || 'null');
    if (v && v.t && Date.now() - v.quando < 12 * 3600e3) return v.t;
  } catch (e) {}
  return '';
}
const GETTONE = ricordaGettone();

const el = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t);
let parola = '';
let partite = [];
let stato = null;          // { gara, casa, ospiti, set, punti, finita }
let passi = [];            // per "annulla ultimo"
let inVolo = null, daMandare = false;

// --- chi sei --------------------------------------------------------------
function intestazione(){
  return parola ? { 'x-segreto': parola } : {};
}
function indirizzo(via){
  return SERVIZIO + via + (GETTONE ? '?t=' + encodeURIComponent(GETTONE) : '');
}

async function entra(p){
  parola = p;
  // prova a leggere lo stato: se la parola e' sbagliata il servizio dice no
  const r = await fetch(SERVIZIO + '/stato', { headers: intestazione() });
  if (!r.ok) return false;
  try { localStorage.setItem(CHIAVE_PAROLA, p); } catch (e) {}
  return true;
}

// --- le partite fra cui scegliere -----------------------------------------
async function caricaPartite(){
  let dati = null;
  try { dati = await (await fetch('data.json?t=' + Date.now())).json(); } catch (e) {}
  const nostre = [];
  (dati?.championships || []).forEach(c => (c.matches || []).forEach(m => {
    if (m.mine) nostre.push({ ...m, campionato: c.label });
  }));
  const oggi = new Date().toISOString().slice(0, 10);
  // prima quelle di oggi, poi le prossime, poi le ultime giocate
  nostre.sort((a, b) => Math.abs(new Date(a.date) - new Date(oggi)) - Math.abs(new Date(b.date) - new Date(oggi)));
  partite = nostre.slice(0, 12);
  el('partita').innerHTML = partite.map((m, i) =>
    '<option value="' + i + '">' + esc(m.date.split('-').reverse().slice(0,2).join('/')) + ' · '
    + esc(m.home) + ' – ' + esc(m.away) + '</option>').join('')
    || '<option value="-1">nessuna partita trovata</option>';
}

function scegli(i){
  const m = partite[i];
  if (!m) return;
  // se il servizio ha gia' un punteggio per questa partita si riprende quello
  if (stato && stato.gara === m.gara) return mostra();
  stato = { gara: m.gara, casa: m.home, ospiti: m.away, set: [], punti: [0, 0], finita: false };
  passi = [];
  mostra();
}

// --- disegno --------------------------------------------------------------
function vintiSet(){
  const v = [0, 0];
  for (const s of (stato?.set || [])) { if (s[0] > s[1]) v[0]++; else if (s[1] > s[0]) v[1]++; }
  return v;
}
function nostra(nome){ return esc(nome).toUpperCase().includes('MARTESANA'); }
function setVinti(n){ return n === 1 ? '1 set vinto' : n + ' set vinti'; }

function mostra(){
  if (!stato) return;
  const v = vintiSet();
  el('n1').textContent = stato.casa;
  el('n2').textContent = stato.ospiti;
  el('p1').textContent = stato.punti[0];
  el('p2').textContent = stato.punti[1];
  el('s1').textContent = setVinti(v[0]);
  el('s2').textContent = setVinti(v[1]);
  el('sq1').className = 'sq' + (nostra(stato.casa) ? ' noi' : '');
  el('sq2').className = 'sq' + (nostra(stato.ospiti) ? ' noi' : '');
  el('parziali').textContent = stato.set.map(s => s[0] + '-' + s[1]).join('   ');
  el('annulla').disabled = !passi.length;
  el('chiudiPartita').textContent = stato.finita ? 'Partita finita ✓' : 'Partita finita';
}

// --- invio ----------------------------------------------------------------
function segna(azione){
  if (!stato) return;
  passi.push(JSON.parse(JSON.stringify(stato)));
  if (passi.length > 60) passi.shift();
  azione();
  mostra();
  manda();
}

async function manda(){
  daMandare = true;
  if (inVolo) return;                     // i tocchi rapidi si accorpano
  while (daMandare) {
    daMandare = false;
    inVolo = fetch(indirizzo('/punteggio'), {
      method: 'POST', headers: { 'content-type': 'application/json', ...intestazione() },
      body: JSON.stringify(stato),
    });
    try {
      const r = await inVolo;
      avviso(r.ok ? '' : 'il servizio ha detto di no (' + r.status + ')', !r.ok);
    } catch (e) {
      avviso('nessuna rete: riprovo', true);
      daMandare = true;                   // in palestra il segnale va e viene
      await new Promise(r => setTimeout(r, 3000));
    }
    inVolo = null;
  }
}

let quandoAvviso = 0;
function avviso(testo, male){
  el('stato').textContent = testo;
  el('stato').className = 'stato' + (male ? ' male' : '');
  if (!testo) return;
  const mio = ++quandoAvviso;
  setTimeout(() => { if (mio === quandoAvviso) el('stato').textContent = ''; }, 4000);
}

// --- comandi --------------------------------------------------------------
document.querySelectorAll('[data-chi]').forEach(b => b.addEventListener('click', () => {
  const chi = Number(b.dataset.chi), quanto = Number(b.dataset.quanto);
  segna(() => { stato.punti[chi] = Math.max(0, stato.punti[chi] + quanto); });
}));

el('chiudiSet').addEventListener('click', () => {
  if (!stato || stato.set.length >= 5) return;
  segna(() => { stato.set.push([stato.punti[0], stato.punti[1]]); stato.punti = [0, 0]; });
});

el('chiudiPartita').addEventListener('click', () => {
  segna(() => {
    // un set ancora aperto con dei punti dentro si chiude da solo
    if (!stato.finita && (stato.punti[0] || stato.punti[1]) && stato.set.length < 5) {
      stato.set.push([stato.punti[0], stato.punti[1]]); stato.punti = [0, 0];
    }
    stato.finita = !stato.finita;
  });
});

el('annulla').addEventListener('click', () => {
  const prima = passi.pop();
  if (!prima) return;
  stato = prima; mostra(); manda();
});

/* "Partita finita" segna il risultato come definitivo; questo invece fa
   sparire del tutto il tabellone dall'app e dal video. */
el('togli').addEventListener('click', async () => {
  if (!confirm('Tolgo il punteggio dall\'app e dal video?')) return;
  try {
    const r = await fetch(indirizzo('/punteggio'), { method: 'DELETE', headers: intestazione() });
    if (!r.ok) return avviso('non ha funzionato (' + r.status + ')', true);
    stato = null; passi = [];
    el('parziali').textContent = '';
    avviso('tolto: il tabellone e\' sparito');
    scegli(Number(el('partita').value) || 0);
  } catch (e) { avviso('nessuna rete', true); }
});

el('partita').addEventListener('change', e => scegli(Number(e.target.value)));

// --- inviti ---------------------------------------------------------------
async function crea(ruolo){
  const m = partite[Number(el('partita').value)] || {};
  const r = await fetch(SERVIZIO + '/invito', {
    method: 'POST', headers: { 'content-type': 'application/json', ...intestazione() },
    body: JSON.stringify({ ruolo, gara: m.gara, casa: m.home, ospiti: m.away, ore: 12 }),
  });
  if (!r.ok) return avviso('non sono riuscito a creare l\'invito', true);
  const inv = await r.json();
  const base = location.href.split('?')[0].replace(/regia\.html$/, '');
  const link = ruolo === 'punti'
    ? base + 'regia.html?t=' + encodeURIComponent(inv.gettone)
    : base + 'diretta.html?t=' + encodeURIComponent(inv.gettone);
  const testo = ruolo === 'punti'
    ? 'Tocca qui per segnare i punti di ' + esc(m.home) + ' – ' + esc(m.away) + ': ' + link
    : 'Tocca qui per trasmettere ' + esc(m.home) + ' – ' + esc(m.away) + ': ' + link;
  if (navigator.share) { try { await navigator.share({ text: testo }); return; } catch (e) {} }
  try { await navigator.clipboard.writeText(testo); avviso('invito copiato: incollalo su WhatsApp'); }
  catch (e) { prompt('Copia questo invito:', testo); }
}
el('invitoPunti').addEventListener('click', () => crea('punti'));
el('invitoVideo').addEventListener('click', () => crea('trasmetti'));

// --- avvio ----------------------------------------------------------------
async function avvia(){
  el('entra').classList.add('nascosto');
  el('tutto').classList.remove('nascosto');
  if (GETTONE) el('delega').classList.add('nascosto');   // chi e' invitato non invita
  await caricaPartite();
  // se una partita e' gia' in corso si riprende da li'
  try {
    const p = await (await fetch(SERVIZIO + '/punteggio')).json();
    if (p && p.casa) {
      stato = { gara: p.gara, casa: p.casa, ospiti: p.ospiti, set: p.set || [],
                punti: p.punti || [0, 0], finita: !!p.finita };
      const i = partite.findIndex(m => m.gara === p.gara);
      if (i >= 0) el('partita').value = i;
      mostra();
      return;
    }
  } catch (e) {}
  scegli(Number(el('partita').value) || 0);
}

el('entraOk').addEventListener('click', async () => {
  if (await entra(el('parola').value.trim())) avvia();
  else el('entraNota').textContent = 'Parola d\'ordine sbagliata.';
});
el('parola').addEventListener('keydown', e => { if (e.key === 'Enter') el('entraOk').click(); });

(async () => {
  if (GETTONE) return avvia();                       // l'invito basta da solo
  let salvata = '';
  try { salvata = localStorage.getItem(CHIAVE_PAROLA) || ''; } catch (e) {}
  if (salvata && await entra(salvata)) avvia();
})();
</script>
</body>
</html>
