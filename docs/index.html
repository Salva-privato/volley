<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Martesana Volley</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d4f50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Martesana">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#eef3f1; --surface:#fff; --surface-2:#e0e9e7; --text:#0d1d1c; --muted:#5b706e;
  --line:#cfdedb; --accent:#1d4f50; --accent-text:#1a4a4b; --accent-soft:#e2edeb;
  --gold:#8a6614; --gold-fill:#b98a22; --on-accent:#fff;
  --win:#1a7f4b; --loss:#a8342a; --warn:#96331f; --warn-soft:#fbe9e4; --radius:14px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#07100f; --surface:#102120; --surface-2:#1a2f2d; --text:#e7efed; --muted:#8fa5a2;
  --line:#23403d; --accent:#256966; --accent-text:#74c4b8; --accent-soft:#15302e;
  --gold:#deb055; --gold-fill:#c9922f; --on-accent:#fff;
  --win:#5fd08f; --loss:#f08072; --warn:#ffa593; --warn-soft:#3a1c17;
}}
:root[data-theme="dark"]{
  --bg:#07100f; --surface:#102120; --surface-2:#1a2f2d; --text:#e7efed; --muted:#8fa5a2;
  --line:#23403d; --accent:#256966; --accent-text:#74c4b8; --accent-soft:#15302e;
  --gold:#deb055; --gold-fill:#c9922f; --on-accent:#fff;
  --win:#5fd08f; --loss:#f08072; --warn:#ffa593; --warn-soft:#3a1c17;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:0 16px calc(32px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
.wrap{max-width:560px;margin:0 auto}
/* Barra fissa in alto: resta ferma e copre la zona dell'orologio e delle
   icone del telefono, cosi' il contenuto non ci finisce sotto scorrendo. */
header{position:sticky;top:0;z-index:50;background:var(--bg);
  margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:8px;
  border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
header.staccata{border-bottom-color:var(--line);box-shadow:0 2px 10px #0000000f}
:root[data-theme="dark"] header.staccata{box-shadow:0 2px 10px #00000055}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) header.staccata{box-shadow:0 2px 10px #00000055}
}
#theme,#campana{margin-left:auto;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);
  font:inherit;font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer;
  display:flex;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent}
#campana{padding:7px 10px}
#campana + #theme{margin-left:8px}
#campana.acceso{background:var(--gold-fill);color:#fff;border-color:transparent}
#theme:active,#campana:active{transform:scale(.96)}
#theme svg,#campana svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#campana svg{width:15px;height:15px}
.brindisi{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:70;
  background:var(--text);color:var(--bg);font-size:13px;font-weight:600;text-align:center;
  padding:11px 14px;border-radius:11px;box-shadow:0 6px 20px #00000030;animation:sali .2s}
h1{font-size:19px;margin:0;letter-spacing:-.02em;white-space:nowrap}
.ttl{display:flex;flex-direction:column;gap:1px;min-width:0}
.mark{width:40px;height:40px;border-radius:50%;background:var(--gold-fill);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center}
#logo{height:36px;width:auto;display:block}
.upd{font-size:11px;color:var(--muted);white-space:nowrap}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
   margin:26px 0 10px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
/* --- carosello prossime partite --- */
.track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always}
.wk{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--gold);margin-bottom:9px}
.dots{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:11px;min-height:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line);transition:width .18s,background .18s}
.dot.on{width:18px;border-radius:3px;background:var(--gold-fill)}
.cnt{font-size:11px;font-weight:600;color:var(--muted)}
/* --- avvisi di partita spostata --- */
.avviso{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);
  border:1px solid transparent;border-left:4px solid var(--warn);border-radius:var(--radius);
  padding:12px 12px 12px 13px;margin-bottom:10px}
.avviso .c{flex:1;min-width:0}
.avviso .t{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
.avviso .q{font-size:13px;font-weight:600;margin-top:3px;line-height:1.35}
.avviso .v{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.avviso .v del{text-decoration:line-through;opacity:.75}
.avviso .v b{color:var(--text);font-weight:600}
.avviso .x{flex:0 0 auto;background:none;border:0;font:inherit;font-size:17px;line-height:1;
  color:var(--muted);padding:2px 2px 6px 8px;cursor:pointer}
/* --- prossima partita --- */
.hero{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold-fill);
  border-radius:var(--radius);padding:16px}
.hero .when{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.hero .day{font-size:22px;font-weight:700;letter-spacing:-.02em}
.hero .cd{font-size:11px;font-weight:700;background:var(--gold-fill);color:#fff;
  padding:3px 9px;border-radius:999px;white-space:nowrap}
.hero .cd.att{background:var(--surface-2);color:var(--muted)}
.hero .cd.diretta{background:var(--loss);display:inline-flex;align-items:center;gap:5px}
.hero .cd.diretta i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulsa 1.4s infinite}
@keyframes pulsa{50%{opacity:.25}}
.btn.diretta{background:var(--loss)}
.hero .cd.vinta{background:var(--win)} .hero .cd.persa{background:var(--loss)}
.vs .sep.ris{font-size:20px;color:var(--text);letter-spacing:-.02em}
.parz{text-align:center;font-size:11px;color:var(--muted);margin:-6px 0 12px;letter-spacing:.02em}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;margin:4px 0 14px}
.vs .t{font-size:15px;font-weight:600;line-height:1.25;text-align:center}
.vs .t.us{color:var(--accent-text)}
.vs .sep{font-size:11px;color:var(--muted);font-weight:700}
.venue{font-size:13px;color:var(--muted);line-height:1.45;border-top:1px solid var(--line);padding-top:11px}
.venue b{color:var(--text);font-weight:600;display:block}
.venue .addr{display:block;font-size:11px;line-height:1.45;text-transform:lowercase}
.btn{display:inline-block;margin-top:11px;background:var(--accent);color:var(--on-accent);
  text-decoration:none;font-size:13px;font-weight:600;padding:9px 15px;border-radius:9px}
.badge{display:block;width:max-content;max-width:100%;margin-inline:auto;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:var(--accent-soft);color:var(--accent-text);padding:3px 8px;border-radius:5px}
.clash{display:block;width:max-content;max-width:100%;margin:9px auto 0;font-size:10px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:5px;
  background:var(--surface-2);color:var(--muted)}
.clash.hot{background:var(--warn-soft);color:var(--warn)}
.clash.mini{margin:5px 0 0;font-size:9.5px;padding:2px 7px}
/* --- lista prossime --- */
.next{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.next:last-child{border-bottom:0}
.next .d{text-align:center;min-width:44px}
.next .d .dd{font-size:17px;font-weight:700;line-height:1}
.next .d .mm{font-size:10px;color:var(--muted);text-transform:uppercase}
.next .i{flex:1;min-width:0}
.next .i .op{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next .i .sub{font-size:11px;color:var(--muted);margin-top:2px}
/* --- scheda di una squadra --- */
.tlink{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:inherit;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.vs .t.tlink{width:100%}
.sfondo{position:fixed;inset:0;background:#000a;z-index:60;animation:sfuma .15s ease-out;border:0}
@keyframes sfuma{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);
  border-radius:18px 18px 0 0;padding:6px 16px calc(20px + env(safe-area-inset-bottom));
  max-height:84vh;overflow:auto;animation:sali .22s cubic-bezier(.2,.8,.3,1)}
@keyframes sali{from{transform:translateY(100%)}}
.sheet .presa{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:17px;line-height:1.25;margin:0 0 2px}
.sheet .sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sheet h4{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin:18px 0 6px}
.pos{display:flex;gap:8px;align-items:center;margin-top:12px;
  background:var(--surface-2);border-radius:10px;padding:10px 12px}
.pos .n{font-size:22px;font-weight:700;line-height:1;color:var(--gold)}
.pos .n small{font-size:11px}
.pos .d{font-size:12px;color:var(--muted);line-height:1.4}
.pos .d b{color:var(--text)}
.sr{display:flex;align-items:center;gap:9px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.sr:last-child{border-bottom:0}
.sr .e{flex:0 0 auto;width:19px;height:19px;border-radius:5px;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--muted)}
.sr .e.v{background:var(--win);color:#fff} .sr .e.s{background:var(--loss);color:#fff}
.sr .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .n em{font-style:normal;color:var(--muted);font-size:11px}
.sr .p{font-weight:700;font-size:13px}
.sr .p.att{font-weight:600;font-size:11px;color:var(--muted);text-transform:uppercase}
.sr.mia{background:var(--accent-soft);margin:0 -12px;padding:8px 12px;border-radius:8px;border-bottom:0}
.sr.mia + .sr.mia{margin-top:4px}
/* --- risultati di tutto il girone --- */
.gm{padding:11px 0;border-bottom:1px solid var(--line)}
.gm:last-child{border-bottom:0}
.gm.us{background:var(--accent-soft);margin:0 -14px;padding:11px 14px 11px 17px;border-radius:8px;border-bottom:0;
  box-shadow:inset 3px 0 var(--gold-fill)}
/* staccata dall intestazione della giornata, che ha lo stesso colore */
.mh + .gm.us{margin-top:9px}
.gm .gh{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.gm .gr{display:flex;align-items:baseline;gap:10px;font-size:13px;line-height:1.5;color:var(--muted)}
.gm .gr.w{color:var(--text);font-weight:700}
.gm .gr .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm .gr .p{font-size:15px;font-weight:700;min-width:14px;text-align:right}
.gm .gr .p.none{font-size:13px;font-weight:600}
.gm .pz{font-size:10.5px;color:var(--muted);margin-top:4px;letter-spacing:.02em}
/* --- tabs --- */
.tabs{display:flex;gap:6px;margin:22px 0 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs button{flex:0 0 auto;background:var(--surface-2);color:var(--muted);border:0;font:inherit;
  font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;font:inherit;font-size:13px;font-weight:600;color:var(--muted);
  padding:7px;border-radius:7px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px #0002}
/* --- calendario --- */
.months{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 12px;padding:0 14px}
.months::-webkit-scrollbar{display:none}
.months button{flex:0 0 auto;background:transparent;color:var(--muted);border:1px solid var(--line);
  font:inherit;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
  padding:6px 13px;border-radius:999px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.months button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mh{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);
  background:var(--accent-soft);margin:16px -14px 0;padding:7px 14px;border-radius:7px}
.mh.first{margin-top:0}
.mh + .row{border-top:0}
.row{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.us{background:var(--accent-soft);margin:0 -14px;padding:11px 14px;border-radius:8px;border-bottom:0}
.row .gd{min-width:42px;text-align:center;font-size:10px;color:var(--muted);line-height:1.3}
.row .gd b{display:block;font-size:15px;color:var(--text)}
.row .tm{flex:1;min-width:0;font-size:13px;line-height:1.35}
.row .tm .u{font-weight:700}
.row .sc{font-size:15px;font-weight:700;min-width:40px;text-align:right}
.row .sc.w{color:var(--win)} .row .sc.l{color:var(--loss)}
.row .sc small{display:block;font-size:9px;font-weight:500;color:var(--muted);margin-top:2px}
.tbd{font-size:11px;color:var(--muted)}
/* --- classifica --- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
   font-weight:700;text-align:right;padding:0 0 8px 7px}
th:nth-child(2){text-align:left}
td{padding:9px 0 9px 7px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{width:37px;padding-left:0;padding-right:0;text-align:center;color:var(--muted)}
th:last-child,td:last-child{padding-right:7px}
tr.us td:first-child{color:inherit}
th:nth-child(n+3),td:nth-child(n+3){padding-left:9px;white-space:nowrap}
td:nth-child(2){text-align:left;font-size:12px;line-height:1.3}
tr.us td{background:var(--accent-soft);font-weight:700}
tr.us td:nth-child(2){box-shadow:inset 3px 0 0 var(--gold-fill)}
tr.us td:first-child{border-radius:7px 0 0 7px}
tr.us td:last-child{border-radius:0 7px 7px 0}
td.pt{font-weight:700;color:var(--gold)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:22px 0}
footer{margin-top:28px;font-size:11px;color:var(--muted);text-align:center;line-height:1.7}
footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header><span class="mark"><img id="logo" src="logo.png" alt=""></span>
    <div class="ttl"><h1>Martesana Volley</h1><span class="upd" id="upd"></span></div>
    <button id="campana" type="button" aria-label="Avvisami"></button>
    <button id="theme" type="button" aria-label="Cambia tema"></button></header>
  <main id="app"><p class="empty">Caricamento…</p></main>
  <footer>
    Dati da <a href="https://www.sol.milano.federvolley.it/" target="_blank" rel="noopener">FIPAV Milano</a><br>
    <span id="foot"></span>
  </footer>
</div>
<script>
const MESI=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const MESI_LUNGHI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
                   'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const GIORNI=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
let DATA=null, DIRETTE={canale:null,gare:{}}, state={champ:0, view:'cal', slide:0, month:null, day:null};
const NOSTRA='MARTESANA VOLLEY';   // in maiuscolo come i nomi che arrivano dalla FIPAV

// Nomi accorciati per la lettura. Si tocca solo cio' che si vede: i dati
// conservano il nome della FIPAV, che serve per i confronti e per le mappe.
const RINOMINA={
  'ASPES VOLLEY CUS STATALE MEDNOW':'ASPES VOLLEY',
  'MARTESANA VOLLEY COLOGNO':NOSTRA,
};
const nome=n=>RINOMINA[String(n||'').trim().toUpperCase()]||n;

const isUs=(d,n)=>norm(n).includes(norm(d.teamMatch));
const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const when=m=>m.date?new Date(`${m.date}T${m.time||'00:00'}:00`):null;

/** Tutte le partite della nostra squadra, di tutti i campionati, ordinate nel tempo. */
function ourMatches(){
  const out=[];
  DATA.championships.forEach((c,ci)=>c.matches.filter(m=>m.mine).forEach(m=>
    out.push({...m, champ:c.label, champIdx:ci, home_us:isUs(DATA,m.home)})));
  return out.sort((a,b)=>{const x=when(a),y=when(b);
    if(!x&&!y)return 0; if(!x)return 1; if(!y)return -1; return x-y;});
}
const played=m=>!!(m.sets&&/\d/.test(m.sets));
const numeri=t=>(String(t??'').match(/\d+/g)||[]).map(Number);

/** I parziali dei set, come coppie [casa, ospite].
 *  La FIPAV li manda su due righe (sopra i punti di casa, sotto quelli degli
 *  ospiti); a volte pero' arrivano appiattiti o gia' scritti "25-20".
 *  Li accetto in tutti e tre i modi, cosi' non si rompe nulla. */
function parziali(m){
  const righe=m.partialsLines;
  if(Array.isArray(righe)&&righe.length===2){
    const a=numeri(righe[0]), b=numeri(righe[1]);
    if(a.length&&a.length===b.length) return a.map((x,i)=>[x,b[i]]);
  }
  const pezzi=String(m.partials||'').trim().split(/\s+/).filter(Boolean);
  if(pezzi.length&&pezzi.every(t=>/^\d+[-–]\d+$/.test(t))) return pezzi.map(numeri);
  const tutti=numeri(m.partials);
  if(tutti.length>=2&&tutti.length%2===0){
    const meta=tutti.length/2;
    return tutti.slice(0,meta).map((x,i)=>[x,tutti[meta+i]]);
  }
  return [];
}
/** I parziali scritti di seguito; "girati" se la nostra squadra gioca fuori. */
const parzialiTesto=(m,girati)=>parziali(m)
  .map(([a,b])=>girati?`${b}-${a}`:`${a}-${b}`).join('  ');

function fmtLong(m){
  const d=when(m); if(!d) return 'Data da destinarsi';
  return `${cap(GIORNI[d.getDay()])} ${d.getDate()} ${MESI[d.getMonth()]}` +
         (m.time?` · ${m.time}`:'');
}
function countdown(m){
  const d=when(m); if(!d) return '';
  const today=new Date(); today.setHours(0,0,0,0);
  const day=new Date(d); day.setHours(0,0,0,0);
  const n=Math.round((day-today)/864e5);
  return n===0?'oggi':n===1?'domani':n>1?`tra ${n} giorni`:'';
}

/** Lunedi' della settimana in cui cade la data. */
function weekStart(d){
  const x=new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate()-((x.getDay()+6)%7));   // 0=lunedi'
  return x;
}
function weekLabel(ws){
  if(ws==='tbd') return 'Data da destinarsi';
  const diff=Math.round((ws-weekStart(new Date()))/(7*864e5));
  if(diff===0) return 'Questa settimana';
  if(diff===1) return 'Settimana prossima';
  const we=new Date(ws); we.setDate(we.getDate()+6);
  return `${ws.getDate()} ${MESI[ws.getMonth()]} – ${we.getDate()} ${MESI[we.getMonth()]}`;
}

/** Mappa data -> partite della squadra, per segnalare i giorni con piu' impegni. */
let GIORNI_PIENI=new Map();
function calcolaConflitti(){
  GIORNI_PIENI=new Map();
  for(const m of ourMatches()){
    if(!m.date) continue;
    if(!GIORNI_PIENI.has(m.date)) GIORNI_PIENI.set(m.date,[]);
    GIORNI_PIENI.get(m.date).push(m);
  }
}
const minuti=t=>{ const x=/^(\d{1,2}):(\d{2})$/.exec(t||''); return x?(+x[1])*60+(+x[2]):null; };

/** Le altre partite dello stesso giorno, con l'indicazione se si sovrappongono. */
function altreDelGiorno(m){
  return (GIORNI_PIENI.get(m.date)||[])
    .filter(x=>x.gara!==m.gara)
    .map(x=>{
      const a=minuti(m.time), b=minuti(x.time);
      const vicine = a!==null && b!==null && Math.abs(a-b)<120;
      return {...x, vicine};
    });
}
function avvisoHTML(m, compatto){
  const altre=altreDelGiorno(m);
  if(!altre.length) return '';
  const grave=altre.some(x=>x.vicine);
  const elenco=altre.map(x=>`${esc(x.champ.replace(' Femminile','').replace('Under ','U'))}${x.time?' '+x.time:''}`).join(', ');
  const testo=grave?`In contemporanea · ${elenco}`:`Stesso giorno · ${elenco}`;
  return `<span class="clash${grave?' hot':''}${compatto?' mini':''}">${testo}</span>`;
}

const PRIMA_DIRETTA=15*60*1000;       // la diretta parte poco prima del fischio
const DURATA_DIRETTA=150*60*1000;     // e dura al massimo due ore e mezza

/** Se in questo momento la partita si sta giocando. */
function siGiocaOra(m){
  const d=when(m); if(!d) return false;
  const t=Date.now()-d.getTime();
  return t>-PRIMA_DIRETTA && t<DURATA_DIRETTA;
}
/** Il video di quella partita, se qualcuno l'ha segnato in dirette.json. */
const videoDi=m=>DIRETTE.gare?.[String(m.gara)]||null;

/** Una partita resta in elenco fino a 1 minuto dopo il suo inizio. */
const scadenza=()=>new Date(Date.now()-60*1000);

const DOPO_FINITA=36*60*60*1000;   // col risultato: un giorno e mezzo
const DOPO_GIOCATA=4*24*60*60*1000; // senza risultato: quattro giorni, poi lascio perdere

/** Se la partita merita ancora un posto nella bacheca in alto.
 *  Dopo il fischio d'inizio non sparisce: resta in attesa del risultato
 *  ufficiale, che la FIPAV pubblica anche qualche giorno dopo. */
function inBacheca(m){
  const d=when(m);
  if(!d) return !played(m);
  const passato=Date.now()-d.getTime();
  if(passato<0) return true;
  return passato < (played(m)?DOPO_FINITA:DOPO_GIOCATA);
}
const iniziata=m=>{ const d=when(m); return !!d && d<=scadenza(); };

/** Le partite della settimana in cui cade la prossima partita in programma. */
function settimanaCorrente(ms){
  const conData=ms.filter(when);
  if(!conData.length) return [];
  const w=weekStart(when(conData[0])).getTime();
  return conData.filter(m=>weekStart(when(m)).getTime()===w);
}

/** Le squadre del girone, in ordine alfabetico: l'indice fa da indirizzo
 *  per aprire la scheda senza dover passare il nome dentro l'HTML. */
function squadreDi(c){
  if(!c._squadre){
    const viste=new Map();
    for(const m of c.matches) for(const t of [m.home,m.away])
      if(t && !viste.has(norm(t))) viste.set(norm(t),t);
    c._squadre=[...viste.values()].sort((a,b)=>a.localeCompare(b,'it'));
  }
  return c._squadre;
}
const indiceSquadra=(ci,t)=>squadreDi(DATA.championships[ci]).findIndex(x=>norm(x)===norm(t));
/** Il nome di una squadra, toccabile per aprirne la scheda. */
function tlink(ci,t,classe){
  const i=indiceSquadra(ci,t);
  if(i<0) return `<span class="${classe||''}">${esc(nome(t))}</span>`;
  return `<button type="button" class="tlink ${classe||''}" onclick="apriSquadra(${ci},${i})">${esc(nome(t))}</button>`;
}

function matchHTML(m){
  const cd=countdown(m);
  const [nostri,loro]=(()=>{
    if(!played(m)) return [null,null];
    const [a,b]=numeri(m.sets);
    return m.home_us?[a,b]:[b,a];
  })();
  const finita=nostri!==null, vinta=finita&&nostri>loro;
  const attesa=!finita&&iniziata(m);
  const ora=!finita&&siGiocaOra(m);
  const video=videoDi(m);
  const diretta = ora ? (video||DIRETTE.canale) : (video||null);
  const maps=m.address?`https://maps.google.com/?q=${encodeURIComponent(m.venue+' '+m.address)}`:null;
  return `<div class="match">
    <div class="when"><span class="day">${esc(fmtLong(m))}</span>
      ${finita?`<span class="cd ${vinta?'vinta':'persa'}">${vinta?'Vinta':'Persa'} ${nostri}-${loro}</span>`
       :ora?`<span class="cd diretta"><i></i>Si gioca ora</span>`
       :attesa?`<span class="cd att">In attesa del risultato</span>`
       :cd?`<span class="cd">${esc(cd)}</span>`:''}</div>
    <span class="badge">${esc(m.champ)} · ${m.home_us?'in casa':'trasferta'}</span>
    ${avvisoHTML(m,false)}
    <div class="vs">
      ${tlink(m.champIdx,m.home,'t '+(m.home_us?'us':''))}
      <div class="sep${finita?' ris':''}">${finita?`${m.home_us?nostri:loro}-${m.home_us?loro:nostri}`:'VS'}</div>
      ${tlink(m.champIdx,m.away,'t '+(m.home_us?'':'us'))}
    </div>
    ${finita&&parzialiTesto(m,false)?`<div class="parz">${esc(parzialiTesto(m,false))}</div>`:''}
    <div class="venue"><b>${esc(m.venue||'Campo da definire')}</b><span class="addr">${esc(m.address||'')}</span>
      ${diretta?`<br><a class="btn diretta" href="${esc(diretta)}" target="_blank" rel="noopener">${
          ora ? (video?'Guarda la diretta':'Cerca la diretta su SpikeVolley TV')
              : iniziata(m)?'Rivedi la partita':'Guarda la diretta'}</a>`:''}
      ${maps&&!iniziata(m)?`<br><a class="btn" href="${maps}" target="_blank" rel="noopener">Apri nel navigatore</a>`:''}
    </div></div>`;
}
function slideHTML(m){
  const d=when(m);
  return `<div class="slide"><div class="hero">
    <div class="wk">${esc(d?weekLabel(weekStart(d)):'Data da destinarsi')}</div>
    ${matchHTML(m)}
  </div></div>`;
}
function nextHTML(m){
  const d=when(m), opp=m.home_us?m.away:m.home;
  return `<div class="next">
    <div class="d">${d?`<div class="dd">${d.getDate()}</div><div class="mm">${MESI[d.getMonth()]}</div>`
                     :'<div class="mm">da<br>dest.</div>'}</div>
    <div class="i"><div class="op">${esc(nome(opp))}</div>
      <div class="sub">${m.home_us?'in casa':'trasferta'}${m.time?' · '+m.time:''} · ${esc(m.champ.replace(' Femminile',''))}</div></div>
  </div>`;
}

/** Le partite della squadra raggruppate per mese, in ordine di data. */
function mesiDi(c){
  const rows=c.matches.filter(m=>m.mine).sort((a,b)=>{
    const x=when(a), y=when(b);
    if(!x&&!y) return (a.giornata||99)-(b.giornata||99);
    if(!x) return 1; if(!y) return -1;
    return x-y;
  });
  const gruppi=[];
  for(const m of rows){
    const d=when(m);
    const key = d ? `${d.getFullYear()}-${d.getMonth()}` : 'tbd';
    let g=gruppi.find(x=>x.key===key);
    if(!g){
      gruppi.push(g={ key,
        breve: d?MESI[d.getMonth()]:'da dest.',
        lungo: d?`${MESI_LUNGHI[d.getMonth()]} ${d.getFullYear()}`:'Data da destinarsi',
        matches:[] });
    }
    g.matches.push(m);
  }
  return gruppi;
}

function rigaHTML(m){
  const d=when(m), us_home=isUs(DATA,m.home), opp=us_home?m.away:m.home;
  let sc='';
  if(played(m)){
    const [a,b]=(m.sets.match(/\d+/g)||[]).map(Number);
    const ourS=us_home?a:b, thS=us_home?b:a;
    sc=`<div class="sc ${ourS>thS?'w':'l'}">${ourS}-${thS}${parzialiTesto(m,!us_home)?`<small>${esc(parzialiTesto(m,!us_home))}</small>`:''}</div>`;
  }
  return `<div class="row">
    <div class="gd">${d?`<b>${d.getDate()} ${MESI[d.getMonth()]}</b>${m.time||''}`
                     :'<span class="tbd">da<br>destinarsi</span>'}</div>
    <div class="tm">${us_home?`<span class="u">${NOSTRA}</span> – ${tlink(state.champ,opp)}`
                       :`${tlink(state.champ,opp,'u')} – <span>${NOSTRA}</span>`}
      <div class="sub" style="font-size:11px;color:var(--muted)">${us_home?'casa':'trasferta'} · ${esc(m.venue||'—')}</div>
      ${avvisoHTML(m,true)}</div>
    ${sc}</div>`;
}

function calHTML(c){
  const gruppi=mesiDi(c);
  if(!gruppi.length) return '<p class="empty">Nessuna partita.</p>';

  // di default si apre sul mese della prossima partita da giocare
  if(state.month===null || !gruppi.some(g=>g.key===state.month)){
    const pross=gruppi.find(g=>g.matches.some(m=>!played(m)&&when(m)&&when(m)>scadenza()));
    state.month=(pross||gruppi[0]).key;
  }
  const g=gruppi.find(x=>x.key===state.month);

  return `<div class="months">${gruppi.map(x=>
      `<button aria-selected="${x.key===state.month}" onclick="setMese('${x.key}')">${esc(x.breve)}</button>`
    ).join('')}</div>
    <div class="mh first">${esc(g.lungo)} · ${g.matches.length} ${g.matches.length===1?'partita':'partite'}</div>
    ${g.matches.map(rigaHTML).join('')}`;
}

function stdHTML(c){
  if(!c.standings.length) return '<p class="empty">Classifica non ancora disponibile.</p>';
  return `<table><thead><tr><th></th><th>Squadra</th><th>P</th><th>G</th><th>V</th><th>S</th><th>Set</th></tr></thead><tbody>`+
    c.standings.map(s=>`<tr class="${isUs(DATA,s.team)?'us':''}">
      <td>${s.pos}</td><td>${esc(nome(s.team))}</td><td class="pt">${esc(s.points)}</td>
      <td>${esc(s.played)}</td><td>${esc(s.won)}</td><td>${esc(s.lost)}</td>
      <td>${esc(s.setsWon)}-${esc(s.setsLost)}</td></tr>`).join('')+`</tbody></table>`;
}

/** Tutte le partite del girone raggruppate per giornata. */
function giornateDi(c){
  const gs=[];
  for(const m of c.matches){
    const n=m.giornata||0;
    let g=gs.find(x=>x.n===n);
    if(!g) gs.push(g={n, matches:[]});
    g.matches.push(m);
  }
  gs.sort((a,b)=>a.n-b.n);
  for(const g of gs){
    g.matches.sort((a,b)=>{const x=when(a),y=when(b);
      if(!x&&!y)return 0; if(!x)return 1; if(!y)return -1; return x-y;});
    const date=g.matches.map(when).filter(Boolean).sort((a,b)=>a-b);
    g.da=date[0]||null; g.a=date[date.length-1]||null;
    g.finita=g.matches.every(played);
  }
  return gs;
}
/** L'arco di date di una giornata: "16 ott" oppure "16 – 18 ott". */
function periodo(g){
  if(!g.da) return 'date da destinarsi';
  const a=g.da, b=g.a;
  if(a.toDateString()===b.toDateString()) return `${a.getDate()} ${MESI[a.getMonth()]}`;
  return a.getMonth()===b.getMonth()
    ? `${a.getDate()} – ${b.getDate()} ${MESI[b.getMonth()]}`
    : `${a.getDate()} ${MESI[a.getMonth()]} – ${b.getDate()} ${MESI[b.getMonth()]}`;
}
/** Una partita del girone: le due squadre, i set vinti, i parziali. */
function gmHTML(m){
  const d=when(m);
  const [a,b]=played(m)?(m.sets.match(/\d+/g)||[]).map(Number):[null,null];
  const riga=(squadra,set,vinta)=>`<div class="gr${vinta?' w':''}">
      <span class="n">${tlink(state.champ,squadra)}</span>
      <span class="p${set===null?' none':''}">${set===null?'–':set}</span></div>`;
  return `<div class="gm${m.mine?' us':''}">
    <div class="gh">${d?esc(`${GIORNI[d.getDay()].slice(0,3)} ${d.getDate()} ${MESI[d.getMonth()]}`+(m.time?` · ${m.time}`:''))
                     :'data da destinarsi'}</div>
    ${riga(m.home,a,a!==null&&a>b)}
    ${riga(m.away,b,b!==null&&b>a)}
    ${parzialiTesto(m,false)?`<div class="pz">${esc(parzialiTesto(m,false))}</div>`:''}
  </div>`;
}
function gironeHTML(c){
  const gs=giornateDi(c);
  if(!gs.length) return '<p class="empty">Nessuna partita.</p>';

  // di default si apre sulla prima giornata non ancora completata
  if(state.day===null || !gs.some(g=>g.n===state.day)){
    state.day=(gs.find(g=>!g.finita)||gs[gs.length-1]).n;
  }
  const g=gs.find(x=>x.n===state.day);

  return `<div class="months">${gs.map(x=>
      `<button aria-selected="${x.n===state.day}" onclick="setGiornata(${x.n})">${x.n?x.n+'ª':'—'}</button>`
    ).join('')}</div>
    <div class="mh first">Giornata ${g.n} · ${esc(periodo(g))}</div>
    ${g.matches.map(gmHTML).join('')}`;
}

/* ============ scheda di una squadra ============ */

/** Una riga della scheda: com'e' finita (o quando si gioca) per quella squadra. */
function srHTML(m, squadra){
  const casa=norm(m.home)===norm(squadra), avv=casa?m.away:m.home, d=when(m);
  const data=d?`${d.getDate()} ${MESI[d.getMonth()]}`:'da dest.';
  // se l'avversaria siamo noi lo dico dal nostro punto di vista, per non confondere
  const dove=isUs(DATA,avv) ? (casa?'in casa loro':'in casa nostra') : (casa?'in casa':'fuori');
  if(!played(m)) return `<div class="sr${isUs(DATA,avv)?' mia':''}">
    <span class="e">·</span>
    <span class="n">${esc(nome(avv))} <em>${dove}</em></span>
    <span class="p att">${esc(data)}</span></div>`;
  const [a,b]=numeri(m.sets), suoi=casa?a:b, loro=casa?b:a, vinta=suoi>loro;
  return `<div class="sr${isUs(DATA,avv)?' mia':''}">
    <span class="e ${vinta?'v':'s'}">${vinta?'V':'S'}</span>
    <span class="n">${esc(nome(avv))} <em>${dove}</em></span>
    <span class="p">${suoi}-${loro}</span></div>`;
}

function schedaHTML(ci, squadra){
  const c=DATA.championships[ci];
  const sue=c.matches.filter(m=>norm(m.home)===norm(squadra)||norm(m.away)===norm(squadra));
  const ordina=(a,b)=>{const x=when(a),y=when(b); if(!x&&!y)return 0; if(!x)return 1; if(!y)return -1; return x-y;};
  const fatte=sue.filter(played).sort(ordina).reverse().slice(0,5);
  const noi=isUs(DATA,squadra);
  const prossime=sue.filter(m=>!played(m) && (noi || !(isUs(DATA,m.home)||isUs(DATA,m.away))))
                    .sort(ordina).slice(0,2);
  const scontri=sue.filter(m=>isUs(DATA,m.home)||isUs(DATA,m.away)).sort(ordina);
  const cl=c.standings.find(x=>norm(x.team)===norm(squadra));

  let h=`<div class="presa"></div>
    <h3>${esc(nome(squadra))}</h3>
    <div class="sub">${esc(c.label)} · girone ${esc(c.girone)}</div>`;

  const iniziato=cl && numeri(cl.played)[0]>0;
  h+= !cl ? `<div class="pos"><div class="d">Classifica non ancora disponibile.</div></div>`
    : !iniziato ? `<div class="pos"><div class="d">Campionato non ancora iniziato.</div></div>`
    : `<div class="pos"><div class="n">${esc(cl.pos)}<small>ª</small></div>
      <div class="d"><b>${esc(cl.points)} punti</b> in ${esc(cl.played)} partite<br>
      ${esc(cl.won)} vinte · ${esc(cl.lost)} perse · set ${esc(cl.setsWon)}-${esc(cl.setsLost)}</div></div>`;

  if(fatte.length) h+=`<h4>Ultime partite</h4>${fatte.map(m=>srHTML(m,squadra)).join('')}`;
  if(prossime.length) h+=`<h4>Prossimi impegni</h4>${prossime.map(m=>srHTML(m,squadra)).join('')}`;
  if(!noi) h+= scontri.length
      ? `<h4>Contro di noi</h4>${scontri.map(m=>srHTML(m,squadra)).join('')}`
      : '';
  return h;
}

function apriSquadra(ci, ti){
  const squadra=squadreDi(DATA.championships[ci])[ti];
  if(!squadra) return;
  chiudiSquadra();
  const bg=document.createElement('div'); bg.className='sfondo'; bg.onclick=chiudiSquadra;
  const sh=document.createElement('div'); sh.className='sheet'; sh.innerHTML=schedaHTML(ci,squadra);
  document.body.append(bg,sh);
  document.body.style.overflow='hidden';
}
function chiudiSquadra(){
  document.querySelectorAll('.sfondo,.sheet').forEach(x=>x.remove());
  document.body.style.overflow='';
}
addEventListener('keydown',e=>{ if(e.key==='Escape') chiudiSquadra(); });

/* ============ partite spostate ============ */
const CHIAVE_VISTI='avvisiVisti';
function visti(){ try{ return JSON.parse(localStorage.getItem(CHIAVE_VISTI)||'[]'); }catch(e){ return []; } }
function segnaVisto(id){
  const v=visti(); if(!v.includes(id)) v.push(id);
  try{ localStorage.setItem(CHIAVE_VISTI, JSON.stringify(v.slice(-40))); }catch(e){}
  render();
}
/** Gli spostamenti che non ho ancora letto, dal piu' recente. */
const daLeggere=()=>(DATA.avvisi||[]).filter(a=>!visti().includes(a.id)).slice(0,3);

const quando=x=>{
  if(!x||!x.date) return 'data da destinarsi';
  const d=new Date(`${x.date}T${x.time||'00:00'}:00`);
  return `${GIORNI[d.getDay()].slice(0,3)} ${d.getDate()} ${MESI[d.getMonth()]}`+(x.time?` · ${x.time}`:'');
};
function avvisoSpostamentoHTML(a){
  const soloCampo=a.cosa.length===1&&a.cosa[0]==='campo';
  const titolo=soloCampo?'Cambio campo':a.cosa.includes('data')?'Partita spostata':'Cambio orario';
  const righe=[];
  if(!soloCampo) righe.push(`<del>${esc(quando(a.prima))}</del> → <b>${esc(quando(a.dopo))}</b>`);
  if(a.cosa.includes('campo'))
    righe.push(`campo: <del>${esc(a.prima.venue||'—')}</del> → <b>${esc(a.dopo.venue||'da definire')}</b>`);
  return `<div class="avviso"><div class="c">
      <div class="t">${titolo}</div>
      <div class="q">${esc(nome(a.home))} – ${esc(nome(a.away))}</div>
      <div class="v">${righe.join('<br>')}</div>
    </div>
    <button type="button" class="x" title="Ho letto" onclick="segnaVisto('${esc(a.id)}')">✕</button></div>`;
}

function render(){
  calcolaConflitti();
  const ms=ourMatches().filter(inBacheca);
  const c=DATA.championships[state.champ];
  // le gia' iniziate restano davanti finche' non arriva il risultato;
  // dietro di loro le altre partite della settimana in corso
  const appena=ms.filter(iniziata);
  const prossime=settimanaCorrente(ms.filter(m=>!iniziata(m)));
  const slides=[...appena,...prossime];
  let h=daLeggere().map(avvisoSpostamentoHTML).join('');
  if(slides.length){
    h+=`<h2>Prossime partite</h2>
        <div class="track" id="track">${slides.map(slideHTML).join('')}</div>`;
    h+= slides.length>1
        ? (slides.length<=8
            ? `<div class="dots" id="dots">${slides.map(()=>'<span class="dot"></span>').join('')}</div>`
            : `<div class="dots" id="dots"><span class="cnt" id="cnt"></span></div>`)
        : '';
  }else{
    h+=`<h2>Prossime partite</h2><div class="card"><p class="empty">Nessuna partita in programma.</p></div>`;
  }
  h+=`<div class="tabs" role="tablist">`+DATA.championships.map((x,i)=>
      `<button role="tab" aria-selected="${i===state.champ}" onclick="pick(${i})">${esc(x.label.replace(' Femminile',''))}</button>`).join('')+`</div>`;
  h+=`<div class="seg">
      <button aria-selected="${state.view==='cal'}" onclick="setView('cal')">Calendario</button>
      <button aria-selected="${state.view==='gir'}" onclick="setView('gir')">Risultati</button>
      <button aria-selected="${state.view==='std'}" onclick="setView('std')">Classifica</button></div>`;
  h+=`<div class="card">${state.view==='cal'?calHTML(c):state.view==='gir'?gironeHTML(c):stdHTML(c)}</div>`;
  firma=slides.map(m=>m.gara).join(',');
  chiudiSquadra();
  $('#app').innerHTML=h;
  initTrack(slides.length);
  // il chip scelto puo' finire fuori schermo a destra: lo riporto al centro
  const scelto=$('.months button[aria-selected="true"]');
  if(scelto) scelto.scrollIntoView({block:'nearest',inline:'center'});
  $('#foot').textContent=DATA.championships.map(x=>`${x.label} · girone ${x.girone}`).join(' — ');
}
/** Carosello: swipe orizzontale con aggancio, pallini sincronizzati. */
function initTrack(n){
  const t=$('#track'); if(!t) return;
  const dots=[...document.querySelectorAll('#dots .dot')];
  const passo=()=>t.firstElementChild.getBoundingClientRect().width+12;   // larghezza slide + gap
  const cnt=$('#cnt');
  const segna=i=>{ state.slide=i;
    dots.forEach((d,j)=>d.classList.toggle('on',j===i));
    if(cnt) cnt.textContent=`${i+1} di ${n}`; };
  segna(Math.min(state.slide||0, n-1));
  t.scrollLeft=(state.slide||0)*passo();
  let timer;
  t.addEventListener('scroll',()=>{
    clearTimeout(timer);
    timer=setTimeout(()=>segna(Math.max(0,Math.min(n-1,Math.round(t.scrollLeft/passo())))),80);
  },{passive:true});
  dots.forEach((d,i)=>d.addEventListener('click',()=>t.scrollTo({left:i*passo(),behavior:'smooth'})));
}
/** Ricontrolla ogni minuto: se una partita e' scaduta, la scheda cambia da sola. */
let firma='';
function controlla(){
  if(!DATA) return;
  const ms=ourMatches().filter(inBacheca);
  const f=[...ms.filter(iniziata),...settimanaCorrente(ms.filter(m=>!iniziata(m)))]
            .map(m=>m.gara+(siGiocaOra(m)?'!':'')).join(',');   // cambia anche quando inizia la diretta
  if(f!==firma){ firma=f; state.slide=0; render(); }
}
setInterval(controlla, 60*1000);

window.pick=i=>{state.champ=i;state.month=null;state.day=null;render()};   // i mesi cambiano da campionato a campionato
window.setMese=k=>{state.month=k;render()};
window.setView=v=>{state.view=v;render()};
window.setGiornata=n=>{state.day=n;render()};
window.segnaVisto=segnaVisto;
window.apriSquadra=apriSquadra;
window.chiudiSquadra=chiudiSquadra;

fetch('data.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  DATA=d;
  const u=new Date(d.updatedAt);
  $('#upd').textContent='agg. '+u.getDate()+' '+MESI[u.getMonth()]+', '+
    String(u.getHours()).padStart(2,'0')+':'+String(u.getMinutes()).padStart(2,'0');
  render();
}).catch(()=>{$('#app').innerHTML='<p class="empty">Dati non disponibili. Riprova quando sei online.</p>'});

// i collegamenti alle dirette stanno in un file a parte, che si puo'
// modificare dal telefono senza toccare il resto
fetch('dirette.json?v='+Date.now()).then(r=>r.ok?r.json():null).then(d=>{
  if(!d) return;
  DIRETTE={canale:d.canale||null, gare:d.gare||{}};
  if(DATA) render();
}).catch(()=>{});

/* --- notifiche ---------------------------------------------------------
   Indirizzo del servizio che spedisce le notifiche. Finche' resta vuoto il
   campanello non compare nemmeno e l'app funziona esattamente come prima. */
const SERVIZIO_PUSH='';

const CAMPANA={
  spenta:'<path d="M18 8a6 6 0 10-12 0c0 7-2 7-2 9h16c0-2-2-2-2-9"/><path d="M10 21a2 2 0 004 0"/>',
  accesa:'<path d="M18 8a6 6 0 10-12 0c0 7-2 7-2 9h16c0-2-2-2-2-9" fill="currentColor"/><path d="M10 21a2 2 0 004 0"/>'
};
const daB64=b=>{ const p='='.repeat((4-b.length%4)%4);
  const grezzo=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...grezzo].map(c=>c.charCodeAt(0))); };
function brindisi(testo){
  document.querySelectorAll('.brindisi').forEach(x=>x.remove());
  const d=document.createElement('div'); d.className='brindisi'; d.textContent=testo;
  document.body.appendChild(d); setTimeout(()=>d.remove(),3800);
}
const campana=$('#campana');
const pushPossibile = SERVIZIO_PUSH && 'serviceWorker' in navigator &&
                      'PushManager' in window && 'Notification' in window;
if(!pushPossibile){ campana.remove(); }
else{
  const disegna=acceso=>{
    campana.innerHTML=`<svg viewBox="0 0 24 24">${acceso?CAMPANA.accesa:CAMPANA.spenta}</svg>`;
    campana.classList.toggle('acceso',acceso);
    campana.setAttribute('aria-label',acceso?'Notifiche attive':'Avvisami');
  };
  disegna(false);
  navigator.serviceWorker.ready
    .then(r=>r.pushManager.getSubscription()).then(s=>disegna(!!s)).catch(()=>{});

  campana.addEventListener('click', async ()=>{
    try{
      const reg=await navigator.serviceWorker.ready;
      const gia=await reg.pushManager.getSubscription();
      if(gia){
        await fetch(SERVIZIO_PUSH+'/iscritti',{method:'DELETE',headers:{'content-type':'application/json'},
          body:JSON.stringify({endpoint:gia.endpoint})}).catch(()=>{});
        await gia.unsubscribe();
        disegna(false); brindisi('Notifiche disattivate.');
        return;
      }
      const permesso=await Notification.requestPermission();
      if(permesso!=='granted'){
        brindisi(permesso==='denied'
          ? 'Notifiche bloccate: riattivale nelle impostazioni del telefono.'
          : 'Notifiche non attivate.');
        return;
      }
      const {chiave}=await (await fetch(SERVIZIO_PUSH+'/chiave')).json();
      const s=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:daB64(chiave)});
      const r=await fetch(SERVIZIO_PUSH+'/iscritti',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({endpoint:s.endpoint})});
      if(!r.ok) throw new Error('il servizio non ha accettato l\'iscrizione');
      disegna(true); brindisi('Fatto: ti avviso per risultati e partite spostate.');
    }catch(e){ brindisi('Non riesco ad attivarle: '+e.message); }
  });
}

// --- tema: auto (come il telefono) / chiaro / scuro, ricordato sul dispositivo ---
const TEMI=[
  {k:'auto', t:'Auto',   i:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5 5l1.5 1.5M17.5 17.5L19 19M3 12h2M19 12h2M5 19l1.5-1.5M17.5 6.5L19 5"/>'},
  {k:'light',t:'Chiaro', i:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5 5l1.5 1.5M17.5 17.5L19 19M3 12h2M19 12h2M5 19l1.5-1.5M17.5 6.5L19 5"/>'},
  {k:'dark', t:'Scuro',  i:'<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>'}
];
const leggi=()=>{try{return localStorage.getItem('tema')||'auto'}catch{return 'auto'}};
function applicaTema(k){
  const r=document.documentElement;
  if(k==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',k);
  const t=TEMI.find(x=>x.k===k)||TEMI[0];
  $('#theme').innerHTML=`<svg viewBox="0 0 24 24">${t.i}</svg>${t.t}`;
  const scuro = k==='dark' || (k==='auto' && matchMedia('(prefers-color-scheme:dark)').matches);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', scuro?'#07100f':'#eef3f1');
  try{localStorage.setItem('tema',k)}catch{}
}
applicaTema(leggi());
$('#theme').addEventListener('click',()=>{
  const i=TEMI.findIndex(x=>x.k===leggi());
  applicaTema(TEMI[(i+1)%TEMI.length].k);
});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{
  if(leggi()==='auto') applicaTema('auto');
});

// la barra prende il bordo solo quando il contenuto le scorre sotto
const barra=document.querySelector('header');
const aggiornaBarra=()=>barra.classList.toggle('staccata', window.scrollY>4);
addEventListener('scroll', aggiornaBarra, {passive:true});
aggiornaBarra();

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
