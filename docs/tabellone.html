<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tabellone</title>
<!--
  Il tabellone del punteggio dal vivo. Sta in piedi da solo e serve in due posti:
   - dentro Moblin, come riquadro web sopra il video che va su YouTube
   - dentro l'app, sovrapposto al riquadro della diretta
  Fondo trasparente: fuori dal tabellone non si disegna niente, cosi' quando
  nessuno sta segnando i punti il video resta pulito.

  Indirizzo:  tabellone.html?gara=70392&modo=video|app
-->
<style>
  /* tutto in "rem" e la radice legata alla larghezza: cosi' il tabellone
     si adatta da solo a qualunque misura gli dia Moblin o l'app */
  html{font-size:calc(100vw / 72); -webkit-text-size-adjust:100%}
  html,body{margin:0;padding:0;background:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
    padding:1.6rem;
  }
  .tab{
    display:inline-block; min-width:23rem; border-radius:.7rem; overflow:hidden;
    box-shadow:0 .25rem 1.2rem #0006; opacity:0; transition:opacity .35s ease;
  }
  .tab.viva{opacity:1}
  /* serve davvero: "display:inline-block" qui sopra batte la regola del
     browser per [hidden], e senza questa riga il riquadro vuoto resterebbe
     stampato sul video quando nessuno sta segnando i punti */
  [hidden]{display:none !important}
  .riga{display:flex; align-items:center; gap:.8rem; padding:.45rem .9rem;
        background:#12302f; color:#fff}
  .riga.noi{background:#1d4f50}
  .riga.loro{background:#243b3a}
  .nome{flex:1; font-size:1.15rem; font-weight:700; letter-spacing:.01em;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:17rem}
  /* i nomi FIPAV arrivano a trentuno caratteri: invece di tagliarli con i
     puntini, la scritta si stringe quanto basta a starci tutta */
  .nome.lungo{font-size:1rem; letter-spacing:0}
  .nome.lunghissimo{font-size:.85rem; letter-spacing:-.01em}
  .set{min-width:1.6rem; text-align:center; font-size:1.05rem; font-weight:800;
       color:#cfe3e0; opacity:.92}
  .punti{min-width:2.8rem; text-align:right; font-size:1.7rem; font-weight:800; line-height:1}
  .riga.noi .punti{color:#ffd77a}
  .parziali{background:#0b1f1ecc; color:#bcd3d0; font-size:.72rem; font-weight:600;
            padding:.28rem .9rem; letter-spacing:.04em}
  .sponsor{margin-top:.6rem; display:none; align-items:center; gap:.5rem;
           background:#0b1f1ecc; color:#e9f2f0; border-radius:.5rem;
           padding:.3rem .7rem; font-size:.66rem; letter-spacing:.06em;
           text-transform:uppercase; box-shadow:0 .15rem .6rem #0005}
  .sponsor.viva{display:inline-flex}
  .sponsor img{height:1.2rem; width:auto; display:block}
  .sponsor b{font-weight:700}
  .sponsor span{opacity:.6; font-weight:600}
  /* Dentro l'app il riquadro e' largo un telefono, non un televisore:
     con la stessa proporzione del video la scritta sarebbe illeggibile,
     quindi qui il tabellone si tiene piu' grande. */
  html.app{font-size:calc(100vw / 46)}
  body.app{padding:.55rem}
  body.app .tab{box-shadow:0 .2rem .7rem #0007}
  body.app .sponsor{display:none !important}
</style>
</head>
<body>
<div class="tab" id="tab" hidden>
  <div class="riga" id="riga1"><span class="nome" id="nome1"></span><span class="set" id="set1"></span><span class="punti" id="punti1"></span></div>
  <div class="riga" id="riga2"><span class="nome" id="nome2"></span><span class="set" id="set2"></span><span class="punti" id="punti2"></span></div>
  <div class="parziali" id="parziali" hidden></div>
</div>
<div class="sponsor" id="sponsor"></div>

<script>
const SERVIZIO = 'https://volley-notifiche.n8ns-piazzolla.workers.dev';
const opzioni = new URLSearchParams(location.search);
const GARA = opzioni.get('gara') || '';
const MODO = opzioni.get('modo') === 'app' ? 'app' : 'video';
// nome della nostra squadra: serve solo a decidere quale riga si colora di casa
const NOSTRA = (opzioni.get('noi') || 'MARTESANA').toUpperCase();
// se il punteggio non si muove da mezz'ora vuol dire che nessuno sta segnando
const SCADUTO = 30 * 60e3;

if (MODO === 'app') { document.body.classList.add('app'); document.documentElement.classList.add('app'); }

const el = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t);

let ultimo = null;

function nostra(nome){ return esc(nome).toUpperCase().includes(NOSTRA); }

// I nomi FIPAV portano davanti la forma giuridica ("A.S.D.", "G.S.", "POL.")
// che ruba spazio e non distingue nessuno. La parte finale invece spesso e'
// il colore della squadra (ROSSA, BLU) e va tenuta.
function accorcia(nome){
  return esc(nome)
    .replace(/^(A\.?S\.?D\.?|S\.?S\.?D\.?|G\.?S\.?|U\.?S\.?|POL\.?|ASSOCIAZIONE)\s+/i, '')
    .replace(/\s+/g, ' ').trim();
}

function scriviNome(dove, nome){
  const corto = accorcia(nome);
  const e = el(dove);
  e.textContent = corto;
  e.className = 'nome' + (corto.length > 24 ? ' lunghissimo' : corto.length > 17 ? ' lungo' : '');
}

function disegna(p){
  // niente da mostrare: il tabellone sparisce del tutto e il video resta pulito
  const vuoto = !p || !p.casa || (GARA && p.gara && p.gara !== GARA)
             || (p.quando && Date.now() - Date.parse(p.quando) > SCADUTO);
  if (vuoto){ el('tab').hidden = true; el('tab').classList.remove('viva'); return; }

  const set = Array.isArray(p.set) ? p.set : [];
  const vinti = [0, 0];
  for (const s of set){ if (s[0] > s[1]) vinti[0]++; else if (s[1] > s[0]) vinti[1]++; }
  const punti = Array.isArray(p.punti) ? p.punti : [0, 0];

  scriviNome('nome1', p.casa);
  scriviNome('nome2', p.ospiti);
  el('set1').textContent = vinti[0];
  el('set2').textContent = vinti[1];
  // a partita finita il numero grande e' quello dei set, non del set in corso
  el('punti1').textContent = p.finita ? vinti[0] : punti[0];
  el('punti2').textContent = p.finita ? vinti[1] : punti[1];
  el('riga1').className = 'riga ' + (nostra(p.casa) ? 'noi' : 'loro');
  el('riga2').className = 'riga ' + (nostra(p.ospiti) ? 'noi' : 'loro');

  const righe = set.map(s => s[0] + '-' + s[1]);
  el('parziali').textContent = righe.join('   ');
  el('parziali').hidden = !righe.length;

  el('tab').hidden = false;
  requestAnimationFrame(() => el('tab').classList.add('viva'));
}

async function chiedi(){
  try {
    const r = await fetch(SERVIZIO + '/punteggio');
    if (!r.ok) return;                       // se il servizio tossisce, si tiene l'ultimo
    const p = await r.json();
    ultimo = p;
    disegna(p);
  } catch (e) { /* rete assente in palestra: si resta su quello che c'e' */ }
}

chiedi();
setInterval(chiedi, 1200);

// --- gli sponsor, solo nel video ------------------------------------------
async function sponsor(){
  if (MODO === 'app') return;
  let elenco = [];
  try {
    const r = await fetch('sponsor.json');
    if (r.ok) elenco = (await r.json()).filter(s => s && s.nome);
  } catch (e) { return; }
  if (!elenco.length) return;
  const box = el('sponsor');
  let i = 0;
  const mostra = () => {
    const s = elenco[i % elenco.length];
    box.innerHTML = (s.logo ? '<img alt="" src="' + esc(s.logo) + '">' : '')
                  + '<span>con</span><b>' + esc(s.nome) + '</b>';
    box.classList.add('viva');
    i++;
  };
  mostra();
  if (elenco.length > 1) setInterval(mostra, 9000);
}
sponsor();
</script>
</body>
</html>
